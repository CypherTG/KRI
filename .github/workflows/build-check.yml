name: Build check (diagnostic)

# Temporary diagnostic workflow: reproduces the Vercel build (Ubuntu, npm ci,
# the exact `npm run build` from vercel.json) outside of Vercel so we can see
# the real error. Safe to delete once deployments are healthy.

on:
  push:
    branches: [ci/diagnose-build]
  workflow_dispatch:

jobs:
  kairos-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairos-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kairos-web/package-lock.json
      - run: npm ci
      - run: npm run build

  gems-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gems-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gems-web/package-lock.json
      - run: npm ci
      - run: npm run build
